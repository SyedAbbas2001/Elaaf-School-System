<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Coming Soon</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300..800&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Open Sans", sans-serif;
}

body {
  min-height: 100vh;
  background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  text-align: center;
}

.container {
  max-width: 700px;
  width: 100%;
  padding: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.logo {
  height: 140px;
  width: 140px;
  border-radius: 50%;
  background: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
  margin-bottom: 25px;
}

.logo img {
  width: 80%;
}

h1 {
  font-size: clamp(32px, 5vw, 48px);
  margin-bottom: 10px;
}

p {
  font-size: clamp(15px, 3vw, 18px);
  margin-bottom: 25px;
  opacity: 0.9;
}

/* 🔥 RESPONSIVE COUNTDOWN */
#countdown {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
  gap: 15px;
  width: 100%;
  max-width: 420px;
  margin-bottom: 30px;
}

#countdown div {
  background: rgba(255,255,255,0.15);
  padding: 14px 10px;
  border-radius: 5px;
}

#countdown span {
  font-size: clamp(22px, 5vw, 28px);
  font-weight: 700;
  display: block;
}

.email-box {
  display: flex;
  width: 100%;
  max-width: 420px;
}

.email-box input {
  flex: 1;
  padding: 12px;
  border: none;
  outline: none;
  border-radius: 4px 0 0 4px;
}

.email-box button {
  padding: 12px 18px;
  border: none;
  background: #C2151D;
  color: #fff;
  cursor: pointer;
  border-radius: 0 4px 4px 0;
}

.email-box button:hover {
  background: #e68900;
}

footer {
  margin-top: 35px;
  font-size: 14px;
  opacity: 0.7;
}
</style>
</head>

<body>

<div class="container">
  <div class="logo">
    <img src="logo-elaaf.png" alt="Elaaf Logo">
  </div>

  <h1>Coming Soon</h1>
  <p>We are working hard to launch our website. Stay tuned!</p>

  <div id="countdown">
    <div><span id="days">00</span>Days</div>
    <div><span id="hours">00</span>Hours</div>
    <div><span id="minutes">00</span>Minutes</div>
    <div><span id="seconds">00</span>Seconds</div>
  </div>

  <div class="email-box">
    <input type="email" placeholder="Enter your email">
    <button>Notify Me</button>
  </div>

  <footer>© 2026 Elaaf School System</footer>
</div>

<script>
  // Auto target: today + 1 month
  const targetDate = new Date();
  targetDate.setMonth(targetDate.getMonth() + 1);

  function updateCountdown() {
    const now = new Date().getTime();
    const distance = targetDate - now;

    if (distance <= 0) return;

    document.getElementById("days").innerText =
      Math.floor(distance / (1000 * 60 * 60 * 24));
    document.getElementById("hours").innerText =
      Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    document.getElementById("minutes").innerText =
      Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
    document.getElementById("seconds").innerText =
      Math.floor((distance % (1000 * 60)) / 1000);
  }

  updateCountdown();
  setInterval(updateCountdown, 1000);
</script>

</body>
</html>
