<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Coming Soon</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      height: 100vh;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      text-align: center;
    }

    .container {
      max-width: 600px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 15px;
      letter-spacing: 2px;
    }

    p {
      font-size: 18px;
      opacity: 0.9;
      margin-bottom: 30px;
    }
   .email-box{
    display: inline-flex;
    width: 100%;
    justify-content: center;
   }
    .email-box input {
      padding: 12px;
      width: 70%;
      border: none;
      outline: none;
      border-radius: 4px 0 0 4px;
    }

    .email-box button {
      padding: 12px 18px;
      border: none;
      background: #ff9800;
      color: #fff;
      cursor: pointer;
      border-radius: 0 4px 4px 0;
    }

    .email-box button:hover {
      background: #e68900;
    }

    footer {
      margin-top: 40px;
      font-size: 14px;
      opacity: 0.7;
    }
    img{
        width: 80%;
    }
    .logo{
        height: 150px;
        width: 150px;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #ffffff;
        margin-bottom: 30px;
    }
    @media (max-width: 600px) {
      h1 {
        font-size: 36px;
      }

      .email-box input {
        width: 65%;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="logo">
      <img src="logo-elaaf.png" alt="">  
    </div>
    
    <h1>Coming Soon</h1>
    <p>We are working hard to launch our website. Stay tuned!</p>

    <div class="email-box">
      <input type="email" placeholder="Enter your email" />
      <button>Notify Me</button>
    </div>

    <footer>
      © 2026 Elaaf School System
    </footer>
  </div>

</body>
</html>
